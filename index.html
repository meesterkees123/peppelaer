<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tafels Oefenen</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f9fafb;
      --card: #ffffff;
      --text: #0f172a;
      --accent: #2563eb;
      --accent-2: #16a34a;
      --border: #e2e8f0;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: var(--card);
      width: min(720px, 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.1);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: -0.02em;
    }
    p.description {
      margin: 0 0 16px;
      color: #475569;
    }
    .meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px;
      margin: 12px 0 20px;
    }
    .chip {
      background: #eef2ff;
      border: 1px solid #e0e7ff;
      color: #312e81;
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .chip strong { font-size: 18px; }
    .status {
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #f8fafc;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .status span { font-weight: 600; }
    .status .live { color: var(--accent-2); }
    .status .ended { color: var(--danger); }
    .question {
      margin: 20px 0 12px;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    form {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 12px;
    }
    input[type="number"] {
      padding: 12px 14px;
      font-size: 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      min-width: 120px;
      flex: 1 1 160px;
    }
    button {
      padding: 12px 18px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      transition: transform 0.05s ease, box-shadow 0.05s ease, opacity 0.2s;
    }
    button.secondary {
      background: #0ea5e9;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .progress {
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin: 12px 0;
    }
    .progress > div {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--accent), #10b981);
      transition: width 0.15s ease-out;
    }
    .feedback {
      min-height: 24px;
      font-weight: 600;
      color: #475569;
    }
    @media (max-width: 540px) {
      .chip { font-size: 14px; }
      .chip strong { font-size: 16px; }
      .question { font-size: 28px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Tafels trainen</h1>
    <p class="description">
      Los 35 vermenigvuldigingen binnen 1,5 minuut op. Klik op Start, typ het antwoord en druk op Enter.
    </p>

    <div class="meta">
      <div class="chip"><span>Doel</span><strong>35 sommen</strong></div>
      <div class="chip"><span>Limiet</span><strong>1:30 min</strong></div>
      <div class="chip"><span>Goed</span><strong id="score">0</strong></div>
      <div class="chip"><span>Resterend</span><strong id="remaining">35</strong></div>
    </div>

    <div class="status">
      <span id="state-label" class="ended">Nog niet gestart</span>
      <span id="time-left">01:30</span>
    </div>

    <div class="question" id="question">3 × 7 = ?</div>

    <form id="answer-form" autocomplete="off">
      <input id="answer" name="answer" type="number" inputmode="numeric" placeholder="Antwoord" required disabled />
      <button type="submit" id="submit-btn" disabled>Controleer</button>
      <button type="button" id="start-btn" class="secondary">Start</button>
    </form>

    <div class="progress"><div id="progress-bar"></div></div>
    <div class="feedback" id="feedback">Klaar om te starten.</div>
  </main>

  <script>
    const TOTAL = 35;
    const TIME_LIMIT_MS = 90_000;

    const questionEl = document.getElementById("question");
    const scoreEl = document.getElementById("score");
    const remainingEl = document.getElementById("remaining");
    const timeLeftEl = document.getElementById("time-left");
    const feedbackEl = document.getElementById("feedback");
    const progressBarEl = document.getElementById("progress-bar");
    const startBtn = document.getElementById("start-btn");
    const submitBtn = document.getElementById("submit-btn");
    const answerInput = document.getElementById("answer");
    const form = document.getElementById("answer-form");
    const stateLabel = document.getElementById("state-label");

    let current;
    let answered = 0;
    let correct = 0;
    let startedAt = 0;
    let timerId;
    let active = false;

    function pad(num) {
      return num.toString().padStart(2, "0");
    }

    function formatMs(ms) {
      const clamped = Math.max(0, ms);
      const s = Math.floor(clamped / 1000);
      const m = Math.floor(s / 60);
      const rest = s % 60;
      return `${pad(m)}:${pad(rest)}`;
    }

    function randomQuestion() {
      const a = Math.floor(Math.random() * 10) + 1;
      const b = Math.floor(Math.random() * 10) + 1;
      return { a, b, answer: a * b };
    }

    function updateUi() {
      scoreEl.textContent = correct;
      remainingEl.textContent = Math.max(0, TOTAL - answered);
      progressBarEl.style.width = `${(answered / TOTAL) * 100}%`;
      submitBtn.disabled = !active;
      answerInput.disabled = !active;
      stateLabel.textContent = active ? "Bezig" : "Gestopt";
      stateLabel.className = active ? "live" : "ended";
    }

    function setFeedback(message, type = "info") {
      const colors = {
        info: "#475569",
        success: "#16a34a",
        error: "#dc2626",
      };
      feedbackEl.style.color = colors[type] || colors.info;
      feedbackEl.textContent = message;
    }

    function nextQuestion() {
      current = randomQuestion();
      questionEl.textContent = `${current.a} × ${current.b} = ?`;
      answerInput.value = "";
      answerInput.focus();
    }

    function stopTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = undefined;
      }
    }

    function finish(reason) {
      active = false;
      stopTimer();
      updateUi();
      startBtn.disabled = false;
      const success = answered >= TOTAL && correct === answered;
      if (reason === "time") {
        setFeedback("Tijd is op. Probeer opnieuw!", "error");
      } else if (success) {
        setFeedback("Top! Alles binnen de tijd opgelost.", "success");
      } else {
        setFeedback("Klaar. Controleer je score en probeer opnieuw.", "info");
      }
    }

    function tick() {
      const elapsed = performance.now() - startedAt;
      const left = TIME_LIMIT_MS - elapsed;
      timeLeftEl.textContent = formatMs(left);
      if (left <= 0) finish("time");
    }

    function start() {
      answered = 0;
      correct = 0;
      active = true;
      startedAt = performance.now();
      stopTimer();
      timerId = setInterval(tick, 200);
      startBtn.disabled = true;
      setFeedback("Succes! Los zo snel mogelijk op.");
      nextQuestion();
      updateUi();
      tick();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (!active || !current) return;
      const value = Number.parseInt(answerInput.value, 10);
      if (Number.isNaN(value)) {
        setFeedback("Vul een geldig getal in.", "error");
        return;
      }
      answered += 1;
      if (value === current.answer) {
        correct += 1;
        setFeedback("Goed!", "success");
      } else {
        setFeedback(`Fout, het was ${current.answer}.`, "error");
      }
      if (answered >= TOTAL) {
        finish("done");
      } else {
        updateUi();
        nextQuestion();
      }
    });

    startBtn.addEventListener("click", start);

    // Start met een willekeurige som zodat de gebruiker iets ziet.
    nextQuestion();
    updateUi();
  </script>
</body>
</html>
