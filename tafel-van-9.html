<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Tafel van 9 - Juf Astrid & Meester Brinno</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
            overflow-x: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            color: #764ba2;
            font-size: 1.2em;
            margin-bottom: 30px;
            font-style: italic;
        }

        .question-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 40px;
            margin: 30px 0;
            color: white;
        }

        .question {
            font-size: 3em;
            font-weight: bold;
            margin: 20px 0;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .answer-input {
            font-size: 2.5em;
            padding: 20px;
            width: 200px;
            text-align: center;
            border: 4px solid #764ba2;
            border-radius: 15px;
            margin: 20px 0;
            font-weight: bold;
            color: #667eea;
        }

        .answer-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
        }

        .keyboard-container {
            margin: 30px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .keyboard-row {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 10px 0;
        }

        .keyboard-key {
            font-size: 2em;
            font-weight: bold;
            width: 80px;
            height: 80px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            touch-action: manipulation;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .keyboard-key:active {
            transform: scale(0.9);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .keyboard-key.delete {
            background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
            font-size: 1.5em;
        }

        .keyboard-key.clear {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            font-size: 1.2em;
            width: 175px;
        }

        .button-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 30px 0;
        }

        button {
            font-size: 1.5em;
            padding: 20px 40px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            min-width: 180px;
            min-height: 70px;
            touch-action: manipulation;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: scale(0.95);
        }

        .check-btn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .check-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .next-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .restart-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .feedback {
            font-size: 1.8em;
            font-weight: bold;
            margin: 20px 0;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .feedback.correct {
            color: #38ef7d;
        }

        .feedback.incorrect {
            color: #f5576c;
        }

        .score-container {
            display: flex;
            justify-content: space-around;
            margin: 30px 0;
            font-size: 1.3em;
            color: #667eea;
            font-weight: bold;
        }

        .score-item {
            background: rgba(102, 126, 234, 0.1);
            padding: 15px 30px;
            border-radius: 15px;
            min-width: 150px;
        }

        .teachers-note {
            background: rgba(102, 126, 234, 0.1);
            border-left: 4px solid #667eea;
            padding: 20px;
            margin: 30px 0;
            border-radius: 10px;
            font-size: 1.1em;
            color: #764ba2;
            text-align: left;
        }

        .teachers-note strong {
            color: #667eea;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .question {
                font-size: 2.5em;
            }

            .answer-input {
                font-size: 2em;
                width: 150px;
            }

            button {
                font-size: 1.2em;
                padding: 15px 30px;
                min-width: 150px;
            }

            .container {
                padding: 20px;
            }

            .keyboard-key {
                width: 70px;
                height: 70px;
                font-size: 1.8em;
            }

            .keyboard-key.clear {
                width: 150px;
            }

            .keyboard-row {
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✏️ Tafel van 9</h1>
        <p class="subtitle">Met Juf Astrid & Meester Brinno</p>

        <div class="teachers-note">
            <strong>💡 Tip van Juf Astrid:</strong> "Onthoud: 9 × 5 = 45, en 9 × 6 = 54. Zie je het patroon?"<br><br>
            <strong>🎯 Tip van Meester Brinno:</strong> "Gebruik je vingers! Voor 9 × 3: buig je 3e vinger, je hebt 2 vingers links en 7 rechts = 27!"
        </div>

        <div class="score-container">
            <div class="score-item">
                <div>✅ Goed</div>
                <div id="correct-score">0</div>
            </div>
            <div class="score-item">
                <div>❌ Fout</div>
                <div id="incorrect-score">0</div>
            </div>
            <div class="score-item">
                <div>📊 Totaal</div>
                <div id="total-score">0</div>
            </div>
        </div>

        <div class="question-container">
            <div class="question" id="question">9 × 1 = ?</div>
            <input type="text" class="answer-input" id="answer-input" placeholder="?" autocomplete="off" inputmode="none" readonly>
            <div class="feedback" id="feedback"></div>
        </div>

        <div class="keyboard-container">
            <div class="keyboard-row">
                <button class="keyboard-key" data-number="7">7</button>
                <button class="keyboard-key" data-number="8">8</button>
                <button class="keyboard-key" data-number="9">9</button>
            </div>
            <div class="keyboard-row">
                <button class="keyboard-key" data-number="4">4</button>
                <button class="keyboard-key" data-number="5">5</button>
                <button class="keyboard-key" data-number="6">6</button>
            </div>
            <div class="keyboard-row">
                <button class="keyboard-key" data-number="1">1</button>
                <button class="keyboard-key" data-number="2">2</button>
                <button class="keyboard-key" data-number="3">3</button>
            </div>
            <div class="keyboard-row">
                <button class="keyboard-key clear" id="clear-key">Wis</button>
                <button class="keyboard-key" data-number="0">0</button>
                <button class="keyboard-key delete" id="delete-key">⌫</button>
            </div>
        </div>

        <div class="button-container">
            <button class="check-btn" id="check-btn">✓ Controleer</button>
            <button class="next-btn hidden" id="next-btn">➡️ Volgende</button>
            <button class="restart-btn" id="restart-btn">🔄 Opnieuw</button>
        </div>
    </div>

    <script>
        let currentQuestion = 1;
        let correctAnswers = 0;
        let incorrectAnswers = 0;
        let totalQuestions = 0;
        let currentAnswer = null;
        let isAnswered = false;

        const questionEl = document.getElementById('question');
        const answerInput = document.getElementById('answer-input');
        const feedbackEl = document.getElementById('feedback');
        const checkBtn = document.getElementById('check-btn');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        const correctScoreEl = document.getElementById('correct-score');
        const incorrectScoreEl = document.getElementById('incorrect-score');
        const totalScoreEl = document.getElementById('total-score');

        function generateQuestion() {
            currentQuestion = Math.floor(Math.random() * 12) + 1;
            currentAnswer = 9 * currentQuestion;
            questionEl.textContent = `9 × ${currentQuestion} = ?`;
            answerInput.value = '';
            feedbackEl.textContent = '';
            feedbackEl.className = 'feedback';
            checkBtn.classList.remove('hidden');
            nextBtn.classList.add('hidden');
            isAnswered = false;
        }

        function checkAnswer() {
            if (isAnswered) return;

            const userAnswer = parseInt(answerInput.value);
            
            if (isNaN(userAnswer)) {
                feedbackEl.textContent = 'Vul een getal in!';
                feedbackEl.className = 'feedback incorrect';
                return;
            }

            isAnswered = true;
            totalQuestions++;

            if (userAnswer === currentAnswer) {
                feedbackEl.textContent = '🎉 Goed gedaan! Juf Astrid is trots op je!';
                feedbackEl.className = 'feedback correct';
                correctAnswers++;
            } else {
                feedbackEl.textContent = `Helaas! Het antwoord is ${currentAnswer}. Meester Brinno zegt: "Probeer het nog eens!"`;
                feedbackEl.className = 'feedback incorrect';
                incorrectAnswers++;
            }

            updateScores();
            checkBtn.classList.add('hidden');
            nextBtn.classList.remove('hidden');
        }

        function nextQuestion() {
            generateQuestion();
        }

        function restart() {
            correctAnswers = 0;
            incorrectAnswers = 0;
            totalQuestions = 0;
            updateScores();
            generateQuestion();
        }

        function updateScores() {
            correctScoreEl.textContent = correctAnswers;
            incorrectScoreEl.textContent = incorrectAnswers;
            totalScoreEl.textContent = totalQuestions;
        }

        checkBtn.addEventListener('click', checkAnswer);
        nextBtn.addEventListener('click', nextQuestion);
        restartBtn.addEventListener('click', restart);

        // Toetsenbord functionaliteit
        const keyboardKeys = document.querySelectorAll('.keyboard-key[data-number]');
        const deleteKey = document.getElementById('delete-key');
        const clearKey = document.getElementById('clear-key');

        function addNumber(number) {
            if (isAnswered) return;
            answerInput.value += number;
        }

        function deleteLast() {
            if (isAnswered) return;
            answerInput.value = answerInput.value.slice(0, -1);
        }

        function clearInput() {
            if (isAnswered) return;
            answerInput.value = '';
        }

        keyboardKeys.forEach(key => {
            key.addEventListener('click', function() {
                addNumber(this.getAttribute('data-number'));
            });
        });

        deleteKey.addEventListener('click', deleteLast);
        clearKey.addEventListener('click', clearInput);

        // Voorkom dat het standaard toetsenbord verschijnt
        answerInput.addEventListener('focus', function(e) {
            e.preventDefault();
            this.blur();
        });

        // Start het spel
        generateQuestion();
    </script>
</body>
</html>
